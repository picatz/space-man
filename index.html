  :root {
    --void: #060818;
    --nebula: #131A3A;
    --horizon: #2A2560;
    --cyan: #38E1FF;
    --cyan-lt: #9FF1FF;
    --suit: #F4F7FF;
    --orange: #FFB454;
    --green: #4EF07A;
    --coral: #FF4F66;
    --gold: #FFC93C;
    --ui: #CFE3FF;
    --panel: rgba(10, 14, 32, 0.86);
    --font-num: ui-rounded, -apple-system, 'Segoe UI', system-ui, sans-serif;
    --font: 'Orbitron', ui-rounded, -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: var(--void);
    overflow: hidden;
    overscroll-behavior: none;
    font-family: var(--font);
    color: var(--ui);
    touch-action: none;
  }

  #game {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    background: var(--void);
  }

  /* ---- DOM overlay screens ---- */
  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
    text-align: center;
  }
  .overlay.show { display: flex; }

  .panel {
    background: var(--panel);
    border: 1px solid rgba(56, 225, 255, 0.25);
    border-radius: 20px;
    padding: 22px 26px;
    max-width: 440px;
    width: 100%;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  }

  .title-lg {
    font-weight: 900;
    letter-spacing: 2px;
    font-size: clamp(20px, 5vw, 30px);
    color: var(--suit);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .sub {
    font-weight: 500;
    font-size: 13px;
    color: var(--ui);
    opacity: 0.75;
    letter-spacing: 1px;
  }

  .btn {
    font-family: var(--font);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-size: 14px;
    color: var(--void);
    background: linear-gradient(180deg, var(--cyan-lt), var(--cyan));
    border: none;
    border-radius: 14px;
    padding: 14px 20px;
    margin: 6px 0;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(56, 225, 255, 0.35);
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.ghost {
    background: transparent;
    color: var(--ui);
    border: 1px solid rgba(207, 227, 255, 0.3);
    box-shadow: none;
  }
  .btn.coral {
    background: linear-gradient(180deg, #ff8b9b, var(--coral));
    color: #fff;
    box-shadow: 0 4px 14px rgba(255, 79, 102, 0.35);
  }

  .row { display: flex; gap: 10px; }
  .row .btn { margin: 6px 0; min-width: 0; padding: 14px 10px; }

  /* attract card sits low so the canvas wordmark + idle astronaut own the upper scene */
  .attract-anchor { justify-content: flex-end; }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 4px 14px rgba(56, 225, 255, 0.35); transform: scale(1); }
    50% { box-shadow: 0 6px 26px rgba(56, 225, 255, 0.7); transform: scale(1.02); }
  }
  .btn.pulse { animation: pulseGlow 1.6s ease-in-out infinite; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(207, 227, 255, 0.08);
  }
  .switch {
    position: relative;
    width: 50px;
    height: 28px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.12);
    transition: background 0.15s;
    flex: 0 0 auto;
    cursor: pointer;
  }
  .switch.on { background: var(--cyan); }
  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.15s;
  }
  .switch.on::after { transform: translateX(22px); }

  table.scores {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 6px;
  }
  table.scores td {
    padding: 7px 4px;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(207, 227, 255, 0.08);
  }
  table.scores td.rank { color: var(--cyan); font-weight: 700; width: 28px; }
  table.scores td.sc { text-align: right; font-weight: 700; color: var(--suit); }

  /* Numeric strings use the system stack — Orbitron's slashed zero reads as Ø
     on exactly the lines that matter most (the delta line, scores, stats). */
  #deadScore, #deadDelta, #deadStats, #attractBest, #attractStats, #trophyStats, table.scores td.sc { font-family: var(--font-num); }

  /* Compact cards for short (phone-landscape) viewports. */
  @media (max-height: 430px) {
    .overlay { padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 10px); }
    .panel { padding: 10px 18px; max-height: calc(100vh - 24px); overflow-y: auto; border-radius: 14px; }
    .title-lg { font-size: 18px; margin-bottom: 2px; }
    .panel .btn { padding: 8px 14px; }
    table.scores td, table.scores th { padding: 2px 8px; font-size: 11px; }
  }
  table.scores tr.me td { color: var(--gold); }

  .stats-line {
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.6;
    margin-top: 10px;
    line-height: 1.7;
  }

  /* initials picker */
  .initials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 16px 0;
  }
  .initial-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .initial-char {
    font-size: 40px;
    font-weight: 900;
    color: var(--cyan-lt);
    width: 48px;
    text-align: center;
    text-shadow: 0 0 12px rgba(56, 225, 255, 0.6);
  }

    background: rgba(56, 225, 255, 0.12);
    border: none;
    border-radius: 8px;
    width: 44px;
    height: 34px;
    color: var(--cyan);
    font-size: 16px;
    cursor: pointer;
  }
  .arrow-btn:active { background: rgba(56, 225, 255, 0.28); }

  .install-chip {
    display: none;
    margin-top: 10px;
    font-size: 12px;
    padding: 10px 14px;
    background: rgba(255, 201, 60, 0.14);
    border: 1px solid rgba(255, 201, 60, 0.4);
    border-radius: 12px;
    color: var(--gold);
    cursor: pointer;
  }
  .install-chip.show { display: block; }

  #errlog {
    position: fixed;
    left: 0;
    bottom: 0;
    max-width: 100%;
    max-height: 40%;
    overflow: auto;
    color: #ff9db0;
    font: 11px/1.4 monospace;
    background: rgba(0, 0, 0, 0.7);
    padding: 4px;
    z-index: 999;
    white-space: pre-wrap;
    display: none;
  }
  #errlog.show { display: block; }

  .hap { position: fixed; left: -9999px; top: -9999px; opacity: 0; pointer-events: none; }
</style>
</head>

<script>
"use strict";

/* ---------------------------------------------------------------------------

  { m: 300,  wMin: 240, wMax: 300, gMin: 160, gMax: 215, dy: 52,  flare: 2.3, shooter: true,  shootIvl: 2.5, ebSpeed: 2.4, narrow: 0 },

  { name: 'PLATINUM', v: 10000, c: '#DCE9FF' },
  { name: 'GOLD',     v: 4500,  c: '#FFC93C' },

  { name: 'BRONZE',   v: 750,   c: '#D98A48' },

   ------------------------------------------------------------------------- */

  loadJSON(LS.stats, {})
);

  if (top5 !== null) return;

   ------------------------------------------------------------------------- */
const canvas = document.getElementById('game');

  canvas.style.height = cssH + 'px';

  cyan: glowSprite(60, 'rgba(56,225,255,0.35)', 0.2),
  coral: glowSprite(40, 'rgba(255,79,102,0.5)', 0.25),
  coralBig: glowSprite(120, 'rgba(255,79,102,0.28)', 0.1),
  gold: glowSprite(34, 'rgba(255,201,60,0.55)', 0.25),
  green: glowSprite(30, 'rgba(78,240,122,0.4)', 0.25),
  white: glowSprite(40, 'rgba(232,244,255,0.5)', 0.2),

/* ---------------------------------------------------------------------------

   ------------------------------------------------------------------------- */
const Audio = (() => {

/* ---------------------------------------------------------------------------
   13. WORLDGEN
   ------------------------------------------------------------------------- */

    dead: false, squash: 0, walkPhase: rng() * TAU, minX: plat.x + 14, maxX: plat.x + plat.w - 14, lookX: 0, lookY: 0 };

function generateAhead() {

    const distNext = (G.genX - G.startX) / 10;

    // gaps and fewer enemies — never announced, expires by ~180m.

      spawnP(p.x, p.y + p.h, -p.facing * rnd(0.5, 1.5), -rnd(0.3, 1), 14, 2, 'rgba(159,241,255,0.6)', 0.05, false, 0);
  } else { p.vx *= p.onGround ? CFG.fricGround : CFG.fricAir; if (Math.abs(p.vx) < 0.05) p.vx = 0; }
  p.vx = clamp(p.vx, -CFG.maxRun, CFG.maxRun);

  if (input.jumpPressed) { p.buffer = CFG.buffer; input.jumpPressed = false; }
  if (p.buffer > 0) p.buffer--;
  if (p.onGround) p.coyote = CFG.coyote; else if (p.coyote > 0) p.coyote--;

  if (p.buffer > 0 && p.coyote > 0 && !p.jumping) {
    p.vy = CFG.jumpVel; p.jumping = true; p.onGround = false; p.coyote = 0; p.buffer = 0;
    p.sqX = 0.8; p.sqY = 1.2;
    if (G.mode === 'play') { Audio.sfx.jump(false); buzz('light'); }
    flags.taughtJump = true;
  }
  if (p.jumping && p.vy < 0 && !input.jumpHeld) { p.vy *= CFG.varJumpCut; p.jumping = false; if (G.mode === 'play') Audio.sfx.jump(true); }

  const rising = p.vy < 0;
  const grav = (rising && input.jumpHeld && p.jumping) ? CFG.gravRise : CFG.gravFall;
  p.vy += grav;
  if (p.vy > CFG.maxFall) p.vy = CFG.maxFall;
  if (p.vy >= 0) p.jumping = false;

  p.x += p.vx;
  const prevFeet = p.py + p.h;
  p.y += p.vy;
  const feet = p.y + p.h, wasGround = p.onGround;
  p.onGround = false;

  if (p.vy >= 0) {
    let landed = null;
    for (const pl of G.platforms) {
      const cx = p.x + p.w * 0.5;
      if (cx <= pl.x - CFG.ledgeForgive || cx >= pl.x + pl.w + CFG.ledgeForgive) continue;
      if (prevFeet <= pl.y + 2 && feet >= pl.y) { landed = pl; break; }
    }
    if (landed) {
      const impact = p.vy;
      p.y = landed.y - p.h; p.vy = 0; p.onGround = true; p.jumping = false; p.groundPlat = landed;
      if (!wasGround) {
        p.sqX = 1.2; p.sqY = 0.8; p.landDip = clamp(impact / 14, 0, 1) * 6;
        burst(p.x, p.y + p.h, 6 + (impact > 8 ? 4 : 0), 1.5, 16, 2.5, 'rgba(159,241,255,0.7)', 0.08, 0);
        if (G.mode === 'play') { Audio.sfx.land(impact); if (impact > 9) buzz('light'); }
        if (G.chain > 0) G.chain = 0;   // landing banks the chain (best already recorded per kill)
      }
    }
  }

  if (p.onGround && Math.abs(p.vx) > 2.5 && G.frameCount % 6 === 0)
    spawnP(p.x - p.facing * 6, p.y + p.h, -p.facing * rnd(0.3, 1), -rnd(0.2, 0.8), 16, 2, 'rgba(159,241,255,0.5)', 0.05, false, 0);
  if (p.vy < -2 && G.frameCount % 2 === 0)
    spawnP(p.x - p.facing * 8, p.y + 6, -p.facing * rnd(0.2, 0.8), rnd(0.4, 1.2), 12, 1.6, 'rgba(255,180,84,0.85)', 0.04, false, 0);

  p.sqX += (1 - p.sqX) * 0.2; p.sqY += (1 - p.sqY) * 0.2; p.landDip *= 0.8;
  p.runCycle += Math.abs(p.vx) * 0.06;
  p.idle = (Math.abs(p.vx) < 0.3 && p.onGround) ? p.idle + STEP : 0;
  p.glint += STEP;
  if (Math.abs(p.vx) > 1) flags.taughtRun = true;
}

function tryShoot() {
  const p = G.player;
  if (G.cooldown > 0) return;
  if (G.ammo <= 0) { Audio.sfx.shoot(true); return; }
  G.ammo--; G.cooldown = CFG.pBulletCooldown;
  G.bullets.push({ x: p.x + p.facing * 12, y: p.y + 12, vx: p.facing * CFG.pBulletSpeed, life: 90 });
  burst(p.x + p.facing * 14, p.y + 12, 3, 2, 8, 2, 'rgba(255,201,60,0.9)', 0, 0);
  Audio.sfx.shoot(false); buzz('select');
  G.trauma = Math.min(1, G.trauma + 0.08);
}

/* ---------------------------------------------------------------------------
   16. ENEMIES + BULLETS
   ------------------------------------------------------------------------- */
function updateEnemies() {
  const p = G.player, B = BANDS[G.band];
  for (const e of G.enemies) {
    if (e.dead) { e.squash += 0.25; continue; }
    if (e.type === 'patrol') {
      e.x += e.dir * e.speed;
      if (e.x <= e.minX) { e.x = e.minX; e.dir = 1; }
      if (e.x >= e.maxX) { e.x = e.maxX; e.dir = -1; }
      e.walkPhase += 0.15;
    } else {
      e.bob += 0.05; e.y = e.baseY + Math.sin(e.bob) * 4;
      e.fireT -= STEP;
      if (e.fireT <= 0.4 && e.telegraph <= 0) { e.telegraph = 0.4; if (G.mode === 'play') Audio.sfx.telegraph(); }
      if (e.telegraph > 0) e.telegraph -= STEP;
      if (e.fireT <= 0) {
        e.fireT = B.shootIvl; e.telegraph = 0;
        let dx = p.x - e.x, dy = (p.y + p.h / 2) - e.y;
        if (G.band >= 5) dx += p.vx * 12;
        const d = Math.hypot(dx, dy) || 1, sp = B.ebSpeed;
        G.ebullets.push({ x: e.x, y: e.y, vx: dx / d * sp, vy: dy / d * sp, life: 220, grazed: false });
      }
    }
    e.lookX = clamp((p.x - e.x) / 120, -1, 1);
    e.lookY = clamp((p.y - e.y) / 120, -1, 1);
  }
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    if ((e.dead && e.squash > 2) || e.x < G.player.x - 700) G.enemies.splice(i, 1);
  }
}

function updateBullets() {
  const px = G.player.x;
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i]; b.x += b.vx; b.life--;
    // Cull relative to the player with a fixed margin (never view.w) so a bullet's reach
    // — and therefore whether it kills a shooter — is identical at any viewport.
    if (b.life <= 0 || Math.abs(b.x - px) > 1400) { G.bullets.splice(i, 1); continue; }
    for (const e of G.enemies) {
      if (e.dead) continue;
      if (Math.abs(b.x - e.x) < e.w * 0.6 && Math.abs(b.y - e.y) < e.h * 0.7) {
        killEnemy(e, 'shoot', e.type === 'shoot' && e.telegraph > 0);
        // Airborne shot kills extend the air chain too — every kill without
        // touching the ground doubles the multiplier, stomp or shot alike.
        if (G.player && !G.player.onGround && !G.player.dead) {
          G.bestChainRun = Math.max(G.bestChainRun, 1 << G.chain);
          G.chain = Math.min(G.chain + 1, CFG.chainCap);
        }
        G.bullets.splice(i, 1); break;
      }
    }
  }
  const p = G.player;
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i]; b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0 || Math.abs(b.x - p.x) > 1400) { G.ebullets.splice(i, 1); continue; }
    const dx = b.x - (p.x + p.w / 2), dy = b.y - (p.y + p.h / 2), dist = Math.hypot(dx, dy);
    if (!p.dead && dist < 9) { die('bullet'); return; }
    if (!b.grazed && dist < 16) {
      b.grazed = true; G.score += CFG.scoreGraze; popup(b.x, b.y, '+5 CLOSE', '#9FF1FF');
      if (G.mode === 'play') { G.timescale = 0.5; G.slowTimer = 0.12; }
      spawnP(b.x, b.y, 0, 0, 20, 3, 'rgba(232,244,255,0.8)', 0, false, 3);
      Audio.sfx.closeCall(clamp(dx / 120, -1, 1)); buzz('select');
    }
    for (let j = G.bullets.length - 1; j >= 0; j--) {
      const pb = G.bullets[j];
      if (Math.abs(pb.x - b.x) < 8 && Math.abs(pb.y - b.y) < 8) {
        burst(b.x, b.y, 6, 2, 12, 2, 'rgba(255,201,60,0.9)', 0.05, 0);
        Audio.sfx.cancel(); G.ebullets.splice(i, 1); G.bullets.splice(j, 1); break;
      }
    }
  }
}

function killEnemy(e, method, interrupted) {
  e.dead = true; e.squash = 0.01;
  G.killsRun++; stats.kills++;
  const mult = 1 << G.chain;
  const pts = (method === 'stomp' ? CFG.scoreStomp : CFG.scoreShoot) * mult;
  G.score += pts;
  popup(e.x, e.y - 10, '+' + pts + (mult > 1 ? ' ×' + mult : ''), method === 'stomp' ? '#4EF07A' : '#FFC93C');
  if (interrupted) { G.score += CFG.scoreInterrupt; popup(e.x, e.y - 26, '+10 STOP', '#FF9DB0'); }
  burst(e.x, e.y, 12, 2.4, 26, 3, 'rgba(78,240,122,0.95)', 0.18, 2);
  if (method === 'stomp' && rng() < CFG.killDropChance)
    G.pickups.push({ type: 'ammo', x: e.x, y: e.y, vy: -2, amt: CFG.killDropAmt, parachute: false, bob: 0, grabbed: false });
  if (method === 'stomp') { Audio.sfx.stomp(G.chain); G.freeze = 0.09; G.trauma = Math.min(1, G.trauma + 0.25); buzz('heavy'); flags.taughtStomp = true; }
  else { Audio.sfx.stomp(Math.min(G.chain, 1)); G.freeze = 0.05; G.trauma = Math.min(1, G.trauma + 0.1); buzz('light'); }
}

/* ---------------------------------------------------------------------------
   17. COLLISIONS — stomp, side contact, void, pickups, flare, PB flag
   ------------------------------------------------------------------------- */
function collisions() {
  const p = G.player; if (p.dead) return;
  const pcx = p.x + p.w / 2, pfeet = p.y + p.h;
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (Math.abs(pcx - e.x) >= (p.w / 2 + e.w / 2 + CFG.stompGrace)) continue;
    if (!(pfeet > e.y - e.h / 2 && p.y < e.y + e.h / 2)) continue;
    const topGap = pfeet - (e.y - e.h / 2);
    if (p.vy > 0 && topGap < CFG.stompOverlap) {
      // Kill scores at the CURRENT multiplier (first kill = x1), then the chain
      // grows for the next one. Recording bestChain here keeps it honest.
      killEnemy(e, 'stomp', false);
      G.bestChainRun = Math.max(G.bestChainRun, 1 << G.chain);
      G.chain = Math.min(G.chain + 1, CFG.chainCap);
      p.vy = input.jumpHeld ? CFG.stompBounceHeld : CFG.stompBounce;
      p.jumping = input.jumpHeld;
      p.y = e.y - e.h / 2 - p.h;
      G.punchZoom = 1.05; G.punchTimer = 0.1;
      if (G.chain >= 2) G.edgePulse = 1;
      // The bounce moved the player; iterating on with stale feet would read a
      // second overlapping enemy as side contact and kill the player unfairly.
      break;
    } else { die('contact'); return; }
  }
  if (p.y > G.groundY + 340) { die('void'); return; }   // fixed threshold → view-independent
  if (p.x <= G.flare.x + 6) { die('flare'); return; }

  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const k = G.pickups[i]; if (k.grabbed) continue;
    const dx = pcx - k.x, dy = (p.y + p.h / 2) - k.y, d = Math.hypot(dx, dy);
    if (d < 60) { k.x += dx * 0.15; k.y += dy * 0.15; }
    if (d < 18) {
      k.grabbed = true;
      const wasZero = G.ammo <= 0;
      G.ammo = Math.min(CFG.ammoCap, G.ammo + k.amt); G.ammoPulse = 1;
      G.score += CFG.scoreAmmo; popup(k.x, k.y, '+AMMO', '#FFC93C');
      burst(k.x, k.y, 10, 2, 20, 2, 'rgba(255,201,60,0.9)', 0, 0);
      Audio.sfx.ammo(wasZero); G.freeze = Math.max(G.freeze, 0.03); buzz('select');
      G.pickups.splice(i, 1);
    }
  }
}

/* ---------------------------------------------------------------------------
   18. FLARE + CAMERA + DISTANCE
   ------------------------------------------------------------------------- */
function updateFlare() {
  const B = BANDS[G.band];
  G.flare.prevX = G.flare.x;
  let target = B.flare;
  if (G.mercy && (G.time - G.runStart) < 30) target *= 0.9;
  G.flare.speed += (target - G.flare.speed) * 0.01;
  // Rubber-band: the flare is the game's forward pressure. A player at max run
  // speed (6.8) outruns every band speed, so without catch-up the chase stops
  // existing after the opening seconds. Surge when far behind and hard-floor
  // the gap so hesitation always summons the dread vignette within ~2s.
  const gapNow = G.player.x - G.flare.x;
  G.flare.x += G.flare.speed * (gapNow > 700 ? 1.6 : 1);
  if (G.flare.x < G.maxX - 1400) G.flare.x = G.maxX - 1400;
  const gap = G.player.x - G.flare.x;
  G.vignette = clamp(1 - gap / 400, 0, 1);
  if (gap < 300) G.trauma = Math.max(G.trauma, 0.1 * (1 - gap / 300));
  // Rising coral embers below the platform line — falling should read as death.
  if (G.frameCount % 18 === 0)
    spawnP(G.player.x + rnd(-view.w * 0.5, view.w * 0.6), G.groundY + rnd(90, 280), rnd(-0.2, 0.2), -rnd(0.3, 0.9), 60, 2, 'rgba(255,110,90,0.5)', -0.005, false, 0);
  // Flare wall embers + crackle jitter (moved out of render: refresh-rate independent).
  if (G.frameCount % 2 === 0)
    spawnP(G.flare.x - rnd(0, 30), G.camY + rnd(0, view.h), rnd(-0.5, 0.5), -rnd(1, 3), 30, 2.5, 'rgba(255,180,120,0.9)', -0.02, false, 0);
  if (G.frameCount % 3 === 0) G.crackle = rng();
}

function updateCamera() {
  const p = G.player;
  G.camXprev = G.camX; G.camYprev = G.camY;
  // Lookahead scales with viewport width so it never dominates a narrow portrait screen.
  const look = p.vx * 14 + p.facing * Math.min(70, view.w * 0.18);
  const targetX = p.x + look - view.w * 0.42;
  G.camX += (targetX - G.camX) * 0.08;
  // HARD BAND CLAMP: guarantee the player's rendered x stays within [15%,60%] of the
  // viewport regardless of lookahead overshoot or lerp lag (critical on narrow portrait).
  G.camX = clamp(G.camX, p.x - view.w * 0.60, p.x - view.w * 0.15);
  if (G.camX < G.flare.x - 40) G.camX = G.flare.x - 40;
  if (p.onGround && p.groundPlat) {
    const tY = p.groundPlat.y - view.h * 0.58, dy = tY - G.camY;
    if (Math.abs(dy) > 40) G.camY += (dy - Math.sign(dy) * 40) * 0.06;
  }
  if (G.punchTimer > 0) G.punchTimer -= STEP; else G.punchZoom += (1 - G.punchZoom) * 0.15;
}

function updateDistance() {
  const p = G.player;
  if (p.x > G.maxX) {
    G.maxX = p.x;
    const m = Math.floor((G.maxX - G.startX) / 10);
    if (m > G.dist) { G.score += (m - G.dist); G.dist = m; }
  }
  // Passing the distance flag celebrates, but only a genuine score record sets
  // newBest — the death card's delta line must never lie.
  if (G.pbFlagX !== null && !G.pbPassed && p.x >= G.pbFlagX) { G.pbPassed = true; celebrate('PAST YOUR FLAG!'); }
  if (!G.newBest && bestScore > 0 && G.score > bestScore) { G.newBest = true; celebrate('NEW BEST!'); }
  if (!G.deep1000 && G.dist >= 1000) { G.deep1000 = true; G.stinger = 2.4; }
}

function celebrate(text) {
  if (G.celebrate > 0) return;
  G.celebrate = 1.6; G.celebrateText = text; G.trauma = Math.min(1, G.trauma + 0.2);
  burst(G.player.x, G.player.y, 24, 3, 40, 3, 'rgba(255,201,60,0.9)', 0.08, 2);
  Audio.sfx.medal(3); buzz('celebrate');
}

/* ---------------------------------------------------------------------------
   19. DEATH
   ------------------------------------------------------------------------- */
function die(cause) {
  const p = G.player; if (p.dead) return;
  p.dead = true; G.deathSeq = 0; G.deathCause = cause;
  // One canonical final score from the instant of death — HUD, card, and
  // top-5 all read this so they can never disagree.
  G.finalScore = Math.floor(G.score);
  G.score = G.finalScore; G.dispScore = G.finalScore;
  G.freeze = 0.25; G.trauma = 1; G.timescale = 0.15; G.slowTimer = 0.6;
  buzz('warn');
  burst(p.x, p.y + p.h / 2, 8, 3, 50, 3.5, 'rgba(244,247,255,0.95)', 0.25, 2);
  G.helmet = { x: p.x, y: p.y + 4, vx: -rnd(1, 3) + p.vx * 0.3, vy: -rnd(3, 6), rot: 0, vr: rnd(-0.3, 0.3) };
  Audio.sfx.death(G.newBest);
}

function finalizeDeath() {
  const fs = G.finalScore !== undefined ? G.finalScore : Math.floor(G.score);
  stats.runs++;
  bestScore = Math.max(bestScore, fs);
  stats.bestScore = bestScore;
  stats.bestDist = Math.max(stats.bestDist, G.dist);
  stats.bestChain = Math.max(stats.bestChain, G.bestChainRun);
  if ((G.time - G.runStart) < 20) stats.deadStreak++; else stats.deadStreak = 0;
  stats.mercy = stats.deadStreak >= 3;
  let medal = null;
  for (const md of MEDALS) if (fs >= md.v) { medal = md; break; }
  if (medal) stats.medals[medal.name] = (stats.medals[medal.name] || 0) + 1;
  G.runMedal = medal;
  // Hints retire after three runs, or individually once the action is performed
  // (per-action flag sets live in the physics/combat code) — never all at once.
  if (stats.runs >= 3) { flags.taughtRun = true; flags.taughtJump = true; flags.taughtStomp = true; }
  const wasFull = top5.length >= 5;
  G.qualifies = (top5.length < 5 || fs > top5[top5.length - 1].score) && fs > 0 && !SHOT;
  // The blocking picker only appears when a genuinely FULL table is cracked — the
  // first five runs auto-commit silently so onboarding restart speed stays sacred.
  G.showPicker = G.qualifies && wasFull;
  // Auto-commit the qualifying entry immediately with the last-used initials so a
  // panic restart can never lose it; the picker merely edits this entry's initials.
  justAdded = null;
  if (G.qualifies) {
    justAdded = { initials: flags.initials, score: fs, dist: G.dist, chain: G.bestChainRun };
    top5.push(justAdded);
    top5.sort((a, b) => b.score - a.score);
    top5 = top5.slice(0, 5);
    if (top5.indexOf(justAdded) < 0) justAdded = null;
  }
  if (!SHOT) persistAll();   // QA bot runs must never write scores/stats
}

/* ---------------------------------------------------------------------------
   20. UPDATE (one fixed 60Hz tick)
   ------------------------------------------------------------------------- */
function update() {
  G.frameCount++;
  if (G.mode === 'play') {
    if (input.shoot || input.shootBtn.pressed) { tryShoot(); input.shoot = false; }
    if (G.cooldown > 0) G.cooldown--;
    updatePlayer();
    updateEnemies();
    updateBullets();
    updatePickups();
    collisions();
    if (G.player.dead) { finishTick(); return; }
    updateFlare();
    updateCamera();
    updateDistance();
    generateAhead();
    G.band = bandFor(G.dist);
    if (G.slowTimer > 0) { G.slowTimer -= STEP; if (G.slowTimer <= 0) G.timescale = 1; }
    if (G.celebrate > 0) G.celebrate -= STEP;
    if (G.stinger > 0) G.stinger -= STEP;
    if (G.edgePulse > 0) G.edgePulse -= 0.06;
    if (G.ammoPulse > 0) G.ammoPulse = Math.max(0, G.ammoPulse - 0.04);
    G.starTimer += STEP;
    if (G.starTimer > 20 && !G.shootingStar) { G.starTimer = 0; G.shootingStar = { x: G.camX + view.w, y: rnd(20, 120), life: 60, vx: -12, vy: 4 }; }
    if (G.shootingStar) { G.shootingStar.x += G.shootingStar.vx; G.shootingStar.y += G.shootingStar.vy; if (--G.shootingStar.life <= 0) G.shootingStar = null; }
    G.dispScore += (G.score - G.dispScore) * 0.2;
    Audio.tickMusic(STEP, G.band, 1 << G.chain);
  } else if (G.mode === 'attract') {
    // Live hero scene: idle astronaut breathing on its platform, gentle parallax sway.
    const p = G.player;
    if (p) { p.idle += STEP; p.glint += STEP; p.facing = 1; p.onGround = true; p.vx = 0; p.vy = 0; }
    if (G.attractBase === undefined && p) G.attractBase = { x: p.x - view.w * 0.46, y: G.groundY - view.h * 0.5 };
    if (G.attractBase) {
      G.camXprev = G.camX; G.camYprev = G.camY;
      G.camX = G.attractBase.x + Math.sin(G.time * 0.28) * 26;
      G.camY = G.attractBase.y + Math.sin(G.time * 0.4) * 7;
    }
    if (p && G.frameCount % 9 === 0) spawnP(p.x - 8, p.y + 6, -rnd(0.2, 0.6), rnd(0.3, 0.9), 20, 1.6, 'rgba(255,180,84,0.7)', 0.03, false, 0);
    G.starTimer += STEP;
    if (G.starTimer > 8 && !G.shootingStar) { G.starTimer = 0; G.shootingStar = { x: G.camX + view.w, y: rnd(20, 110), life: 72, vx: -11, vy: 4 }; }
    if (G.shootingStar) { G.shootingStar.x += G.shootingStar.vx; G.shootingStar.y += G.shootingStar.vy; if (--G.shootingStar.life <= 0) G.shootingStar = null; }
  }
  finishTick();
}
function finishTick() {
  updateParticles();
  updatePopups();
  G.trauma = Math.max(0, G.trauma - 0.03);
  const tr = G.trauma * G.trauma;
  if (settings.shake && G.mode !== 'attract') {
    G.shake.x = (rng() * 2 - 1) * tr * 10;
    G.shake.y = (rng() * 2 - 1) * tr * 10;
    G.shake.rot = (rng() * 2 - 1) * tr * 0.015;
  } else { G.shake.x = 0; G.shake.y = 0; G.shake.rot = 0; }
  if (G.helmet) {
    G.helmet.vy += 0.4; G.helmet.x += G.helmet.vx; G.helmet.y += G.helmet.vy; G.helmet.rot += G.helmet.vr;
    if (G.helmet.y > G.groundY - 6) { G.helmet.y = G.groundY - 6; G.helmet.vy *= -0.4; G.helmet.vx *= 0.8; }
  }
}

/* ---------------------------------------------------------------------------
   21. FIXED-TIMESTEP LOOP with interpolation + hitstop + slow-mo
   ------------------------------------------------------------------------- */
let acc = 0, lastT = 0, rafId = 0, shotFrozen = false;
function frame(now) {
  rafId = requestAnimationFrame(frame);
  if (shotFrozen) { render(1); return; }   // QA: re-render frozen state (survives post-load resizes)
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.25) dt = 0.25;
  G.time += dt;

  if (G.mode === 'resume') { G.resumeT -= dt; if (G.resumeT <= 0) G.mode = 'play'; }

  if (G.player && G.player.dead) {
    G.deathSeq += dt;
    if (G.deathZoom < 1.3) G.deathZoom += dt * 1.5;
    if (G.deathSeq > 0.85 && G.mode === 'play' && !G.deathCardShown) showDeathCard();
  }

  if (G.freeze > 0) { G.freeze -= dt; render(1); return; }

  acc += dt * (G.mode === 'play' ? G.timescale : 1);
  let steps = 0;
  while (acc >= STEP && steps < 6) {
    if (G.mode === 'play' || G.mode === 'attract') update();
    acc -= STEP; steps++;
  }
  // Drop unpayable debt after the step cap or a slow device spirals: 6 updates
  // per render forever, with simulation lagging real input.
  if (acc > STEP) acc = STEP;
  render(clamp(acc / STEP, 0, 1));
}

/* ---------------------------------------------------------------------------
   22. RENDER
   ------------------------------------------------------------------------- */
function render(alpha) {
  const iCamX = lerp(G.camXprev, G.camX, alpha);
  const iCamY = lerp(G.camYprev, G.camY, alpha);
  ctx.save();
  ctx.scale(view.scale, view.scale);
  ctx.fillStyle = '#060818'; ctx.fillRect(0, 0, view.w, view.h);

  drawBackground(iCamX);

  const zoom = (G.player && G.player.dead ? G.deathZoom : G.punchZoom);
  ctx.save();
  const cx = view.w / 2, cy = view.h / 2;
  ctx.translate(cx + G.shake.x, cy + G.shake.y);
  ctx.rotate(G.shake.rot);
  ctx.scale(zoom, zoom);
  ctx.translate(-cx, -cy);
  ctx.translate(-iCamX, -iCamY);

  drawFlare(iCamX);
  // The void below the platform line darkens — falling must read as death.
  const dg = ctx.createLinearGradient(0, G.groundY + 60, 0, G.groundY + 330);
  dg.addColorStop(0, 'rgba(4,5,16,0)'); dg.addColorStop(1, 'rgba(4,5,16,0.85)');
  ctx.fillStyle = dg;
  ctx.fillRect(iCamX - view.w, G.groundY + 60, view.w * 3, 600);
  drawPlatforms(iCamX);
  drawPickups();
  drawPBFlag();
  drawEnemies();
  drawBullets();
  if (G.player) drawPlayer(alpha);
  drawParticles();
  drawHints(iCamX);
  ctx.restore();

  drawPopups(iCamX, iCamY);
  drawForeground(iCamX);
  drawVignette();
  if (G.mode === 'attract') drawWordmark();
  if (G.mode === 'play' || G.mode === 'pause' || G.mode === 'resume' || (G.player && G.player.dead)) drawHUD();
  if ((FORCE_TOUCH || input.usingTouch) && (G.mode === 'play' || G.mode === 'resume')) drawTouchControls();
  if (G.mode === 'resume') {
    ctx.textAlign = 'center';
    drawGlowText(String(clamp(Math.ceil(G.resumeT / 0.434), 1, 3)), view.w / 2, view.h / 2, 46, '#38E1FF', '#F4F7FF');
  }
  drawCelebration();
  ctx.restore();
}

/* ---- SPACE MAN wordmark: 900-weight canvas text, cyan-glow underlay + white fill,
   slight skew, chromatic offset shadows (cyan left, coral right). ---- */
function drawWordmark() {
  const text = 'SPACE MAN';
  const cy = Math.max(52, view.h * 0.19);
  let size = clamp(view.w * 0.13, 18, 68);
  ctx.font = '900 ' + size + 'px ' + FONT;
  const w = ctx.measureText(text).width;
  const maxW = view.w * 0.86;
  if (w > maxW) { size = Math.max(14, size * maxW / w); ctx.font = '900 ' + size + 'px ' + FONT; }
  const cx = view.w / 2 + cy * 0.08;       // compensate the skew's x-shift so it stays centered
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.transform(1, 0, -0.08, 1, 0, 0);
  ctx.fillStyle = '#38E1FF'; ctx.globalAlpha = 0.85; ctx.fillText(text, cx - 3, cy);      // cyan chroma left
  ctx.fillStyle = '#FF4F66'; ctx.fillText(text, cx + 3, cy);                              // coral chroma right
  ctx.globalAlpha = 0.55; ctx.fillStyle = '#38E1FF'; ctx.fillText(text, cx, cy + 2.5);    // cyan glow underlay
  ctx.globalAlpha = 1; ctx.fillStyle = '#F4F7FF'; ctx.fillText(text, cx, cy);             // white top layer
  ctx.restore();
  // tagline pulse under the wordmark
  ctx.globalAlpha = 0.4 + 0.3 * (0.5 + 0.5 * Math.sin(G.time * 3));
  ctx.fillStyle = '#9FF1FF'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 ' + clamp(size * 0.2, 9, 13) + 'px ' + FONT;
  ctx.fillText('OUTRUN THE FLARE', view.w / 2, cy + size * 0.62);
  ctx.globalAlpha = 1;
}

/* ---- background parallax ---- */
let nebulaCanvas = null, nebulaHue = -1;
function buildNebula(hue) {
  const W = view.w, H = view.h;
  const c = makeCanvas(W, H), g = c.getContext('2d');
  // Evenly-spaced overlapping blobs give uniform coverage (no flat gaps that read as an
  // edge). Each is drawn wrapped at ±W so the tile repeats seamlessly with no visible seam.
  const blobs = [
    [0.06, 0.56, 0.44], [0.26, 0.30, 0.38], [0.44, 0.66, 0.42],
    [0.62, 0.36, 0.40], [0.80, 0.60, 0.46], [0.98, 0.34, 0.36],
  ];
  blobs.forEach((b, i) => {
    const bx = b[0] * W, y = b[1] * H, r = W * b[2];
    for (const x of [bx - W, bx, bx + W]) {
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, `hsla(${hue + i * 6}, 62%, 32%, 0.32)`);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
    }
  });
  return c;
}
const starfield = { far: [], mid: [], near: [] };
let starsBuilt = false;
function buildStars() {
  const sr = mulberry32(9999);
  starfield.far = []; starfield.mid = []; starfield.near = [];
  const W = 1600;
  for (let i = 0; i < 120; i++) starfield.far.push({ x: sr() * W, y: sr() * view.h * 0.85, ph: sr() * TAU });
  for (let i = 0; i < 60; i++) starfield.mid.push({ x: sr() * W, y: sr() * view.h * 0.8, ph: sr() * TAU });
  for (let i = 0; i < 40; i++) starfield.near.push({ x: sr() * W, y: sr() * view.h * 0.75, ph: sr() * TAU });
  starsBuilt = true;
}
function drawBackground(camX) {
  const grd = ctx.createLinearGradient(0, 0, 0, view.h);
  grd.addColorStop(0, '#060818'); grd.addColorStop(0.5, '#131A3A'); grd.addColorStop(1, '#2A2560');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, view.w, view.h);

  const hue = BAND_HUE[G.band] || 218;
  if (!nebulaCanvas || Math.abs(nebulaHue - hue) > 1) { nebulaCanvas = buildNebula(hue); nebulaHue = hue; }
  ctx.globalAlpha = 0.85;
  const nx = -(((camX * 0.05) % view.w) + view.w) % view.w;
  ctx.drawImage(nebulaCanvas, nx, 0); ctx.drawImage(nebulaCanvas, nx + view.w, 0);
  ctx.globalAlpha = 1;

  if (!starsBuilt) buildStars();
  const W = 1600;
  ctx.fillStyle = '#E8F4FF';
  for (const s of starfield.far) {
    const x = ((s.x - camX * 0.15) % W + W) % W;
    ctx.globalAlpha = 0.5 * (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(G.time * 2 + s.ph)));
    ctx.fillRect(x, s.y, 1, 1);
  }
  for (const s of starfield.mid) {
    const x = ((s.x - camX * 0.3) % W + W) % W;
    ctx.globalAlpha = 0.7 * (0.6 + 0.4 * Math.sin(G.time * 1.5 + s.ph));
    ctx.fillRect(x, s.y, 2, 2);
  }
  ctx.globalAlpha = 1;
  drawPlanet(camX);
  const spd = Math.abs(G.player ? G.player.vx : 0);
  for (const s of starfield.near) {
    const x = ((s.x - camX * 0.5) % W + W) % W;
    ctx.globalAlpha = 0.85 * (0.6 + 0.4 * Math.sin(G.time * 1.2 + s.ph));
    ctx.fillStyle = '#E8F4FF'; ctx.fillRect(x, s.y, 3, 3);
    if (spd > 3) { ctx.globalAlpha = 0.3; ctx.fillRect(x, s.y + 1, spd * 0.8, 1); }
  }
  ctx.globalAlpha = 1;
  if (G.shootingStar) {
    const s = G.shootingStar, sx = ((s.x - camX * 0.3) % W + W) % W;
    ctx.strokeStyle = 'rgba(232,244,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx, s.y); ctx.lineTo(sx + 30, s.y - 10); ctx.stroke();
  }
}
function drawPlanet(camX) {
  const x = ((260 - camX * 0.25) % 1700 + 1700) % 1700 - 300, py = 88;
  if (x < -120 || x > view.w + 120) return;
  ctx.save(); ctx.globalAlpha = 0.65;
  const grd = ctx.createRadialGradient(x - 12, py - 12, 4, x, py, 46);
  grd.addColorStop(0, '#3a3f80'); grd.addColorStop(1, '#191c40');
  ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(x, py, 46, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(159,241,255,0.25)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(x, py, 70, 16, -0.4, 0, TAU); ctx.stroke();
  ctx.restore();
}
function drawForeground(camX) {
  ctx.fillStyle = 'rgba(232,244,255,0.06)';
  const W = 900;
  for (let i = 0; i < 14; i++) { const x = ((i * 137 - camX * 1.3) % W + W) % W, y = (i * 53) % view.h; ctx.fillRect(x, y, 2, 2); }
}

/* ---- flare wall ---- */
function drawFlare(camX) {
  const fx = G.flare.x;
  if (fx < camX - 130) return;
  ctx.save();
  ctx.drawImage(GLOW.coralBig, fx - 120, G.camY + view.h / 2 - 120, 240, 240);
  const grd = ctx.createLinearGradient(fx - 120, 0, fx + 8, 0);
  grd.addColorStop(0, 'rgba(255,79,102,0)');
  grd.addColorStop(0.6, 'rgba(255,79,102,0.35)');
  grd.addColorStop(0.85, 'rgba(255,140,90,0.75)');
  grd.addColorStop(1, 'rgba(255,220,180,0.95)');
  ctx.fillStyle = grd; ctx.fillRect(fx - 120, G.camY - 100, 130, view.h + 400);
  ctx.strokeStyle = 'rgba(255,235,200,0.7)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(fx - 4, G.camY);
    for (let y = G.camY; y < G.camY + view.h; y += 40) ctx.lineTo(fx - 4 + Math.sin(y * 0.3 + G.crackle * 10 + i) * 10, y);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---- platforms ---- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawPlatforms(camX) {
  for (const pl of G.platforms) {
    if (pl.x + pl.w < camX - 40 || pl.x > camX + view.w + 40) continue;
    const x = pl.x, y = pl.y, w = pl.w;
    ctx.drawImage(GLOW.cyan, x + w / 2 - 60, y - 44, 120, 120);
    const grd = ctx.createLinearGradient(0, y, 0, y + 44);
    grd.addColorStop(0, '#38E1FF'); grd.addColorStop(1, '#123A6B');
    ctx.fillStyle = grd; roundRect(x, y, w, 40, 8); ctx.fill();
    // Continuous bright top edge with flush end-caps — the surface line must
    // read at speed (high contrast against the cyan fill, following the corners).
    ctx.strokeStyle = '#E9FDFF'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x + 4, y + 2); ctx.lineTo(x + w - 4, y + 2); ctx.stroke();
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x + 2, y + 1, 10, 3.5); ctx.fillRect(x + w - 12, y + 1, 10, 3.5);
    // Crystal stalactites hang flush from the slab underside in its dark tone.
    ctx.fillStyle = '#123A6B';
    const n = w > 200 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const sx = x + (i + 0.5) * (w / n);
      ctx.beginPath(); ctx.moveTo(sx - 8, y + 36); ctx.lineTo(sx + 8, y + 36); ctx.lineTo(sx, y + 38 + 16 + (i % 2) * 6); ctx.closePath(); ctx.fill();
    }
    // Feathered under-glow (stretched radial sprite, no hard-edged bar).
    ctx.globalAlpha = 0.4;
    ctx.drawImage(GLOW.cyan, x - 14, y + 26, w + 28, 52);
    ctx.globalAlpha = 1;
  }
}

/* ---- pickups: state ticks in update() (fixed 60Hz), drawing stays pure ---- */
function updatePickups() {
  for (const k of G.pickups) {
    if (k.grabbed) continue;
    if (k.parachute) {
      k.y += k.vy; k.bob += 0.05; k.x += Math.sin(k.bob) * 0.4;
      const gp = platformUnder(k.x, k.y + 20, 30); if (gp && k.y > gp.y - 20) { k.y = gp.y - 20; k.parachute = false; k.vy = 0; }
    } else {
      k.bob = (k.bob || 0) + 0.08;
      if (k.vy) { k.vy += 0.2; k.y += k.vy; const gp = platformUnder(k.x, k.y, 30); if (gp && k.y > gp.y - 10) { k.y = gp.y - 10; k.vy = 0; } }
    }
  }
}
function drawPickups() {
  for (const k of G.pickups) {
    if (k.grabbed) continue;
    if (k.parachute) {
      ctx.fillStyle = 'rgba(255,201,60,0.85)';
      ctx.beginPath(); ctx.arc(k.x, k.y - 16, 12, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(255,201,60,0.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(k.x - 10, k.y - 16); ctx.lineTo(k.x, k.y); ctx.moveTo(k.x + 10, k.y - 16); ctx.lineTo(k.x, k.y); ctx.stroke();
    }
    const by = k.y + Math.sin(k.bob || 0) * 2;
    ctx.drawImage(GLOW.gold, k.x - 34, by - 34, 68, 68);
    ctx.fillStyle = '#FFC93C'; roundRect(k.x - 6, by - 9, 12, 18, 3); ctx.fill();
    ctx.fillStyle = '#FFE59A'; ctx.fillRect(k.x - 3, by - 6, 6, 3);
  }
}

/* ---- PB flag ---- */
function drawPBFlag() {
  if (G.pbFlagX === null) return;
  const gp = platformUnder(G.pbFlagX, G.groundY + 300, 500);
  const fx = G.pbFlagX, fy = gp ? gp.y : G.groundY;
  ctx.strokeStyle = '#CFE3FF'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 40); ctx.stroke();
  ctx.fillStyle = G.pbPassed ? '#FFC93C' : '#FF4F66';
  ctx.beginPath(); ctx.moveTo(fx, fy - 40); ctx.lineTo(fx + 22, fy - 34); ctx.lineTo(fx, fy - 28); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#060818'; ctx.font = '700 8px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText(flags.initials, fx + 9, fy - 32);
}

/* ---- enemies ---- */
function drawEnemies() {
  for (const e of G.enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.dead) { const s = clamp(1 - e.squash, 0, 1); ctx.scale(1 + e.squash, s); }
    const walk = e.type === 'patrol' ? Math.sin(e.walkPhase) : Math.sin(e.bob || 0);
    const squash = 1 + walk * 0.08;
    const tel = e.telegraph > 0;
    if (e.type === 'shoot') { ctx.fillStyle = '#1F9E4E'; ctx.beginPath(); ctx.ellipse(0, 7, 16, 6, 0, 0, TAU); ctx.fill(); }
    ctx.drawImage(GLOW.green, -30, -30, 60, 60);
    ctx.fillStyle = tel && Math.floor(G.time * 20) % 2 ? '#8CFFB0' : '#4EF07A';
    ctx.beginPath(); ctx.ellipse(0, 0, e.w / 2, (e.h / 2) * squash, 0, Math.PI, TAU); ctx.fill();
    roundRect(-e.w / 2, -1, e.w, e.h / 2 + 2, 5); ctx.fill();
    const antC = e.type === 'shoot' ? (tel ? '#FF4F66' : '#FF8090') : '#BFFFD0';
    ctx.strokeStyle = '#2FBF5F'; ctx.lineWidth = 1.5;
    for (const sgn of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sgn * 4, -e.h / 2 + 2);
      ctx.quadraticCurveTo(sgn * 8, -e.h / 2 - 6, sgn * 6 + walk * 2, -e.h / 2 - 12); ctx.stroke();
      ctx.fillStyle = antC; ctx.beginPath(); ctx.arc(sgn * 6 + walk * 2, -e.h / 2 - 12, tel ? 3.5 : 2.5, 0, TAU); ctx.fill();
    }
    const lx = e.lookX * 2, ly = e.lookY * 1.5;
    for (const sgn of [-1, 1]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(sgn * 5, -2, 3.5, 4.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0a1428'; ctx.beginPath(); ctx.arc(sgn * 5 + lx, -2 + ly, 1.8, 0, TAU); ctx.fill();
    }
    if (e.type === 'patrol') {
      ctx.fillStyle = '#1F9E4E';
      ctx.beginPath(); ctx.arc(-5, e.h / 2 - 1 + Math.abs(walk) * 2, 3, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(5, e.h / 2 - 1 + Math.abs(walk) * 2, 3, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---- bullets ---- */
function drawBullets() {
  for (const b of G.bullets) {
    ctx.strokeStyle = 'rgba(255,201,60,0.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.8, b.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.fillStyle = '#FFE59A'; ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, TAU); ctx.fill();
  }
  for (const b of G.ebullets) {
    ctx.drawImage(GLOW.coral, b.x - 20, b.y - 20, 40, 40);
    ctx.fillStyle = '#FF4F66'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#FFB0BC'; ctx.beginPath(); ctx.arc(b.x - 1, b.y - 1, 1.5, 0, TAU); ctx.fill();

}

/* ---- player ---- */
function drawPlayer(alpha) {
  const p = G.player;
  const x = lerp(p.px, p.x, alpha) + p.w / 2;
  const y = lerp(p.py, p.y, alpha) + p.h / 2 + p.landDip;
  if (p.dead && G.deathSeq > 0.08) {
    if (G.helmet) {
      ctx.save(); ctx.translate(G.helmet.x + p.w / 2, G.helmet.y); ctx.rotate(G.helmet.rot);
      ctx.drawImage(GLOW.white, -20, -20, 40, 40);
      ctx.fillStyle = '#F4F7FF'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1479FF'; ctx.beginPath(); ctx.arc(2, 0, 5, 0, TAU); ctx.fill();
      ctx.restore();
    }
    return;
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(p.facing, 1);
  const breathe = p.idle > 0 ? Math.sin(G.time * 3) * 0.03 : 0;
  ctx.scale(p.sqX + breathe, p.sqY - breathe);
  const hw = p.w / 2, hh = p.h / 2;

  const legSwing = p.onGround ? Math.sin(p.runCycle) * Math.min(Math.abs(p.vx) * 1.2, 6) : (p.vy < 0 ? -4 : 4);
  ctx.strokeStyle = '#DCE6FF'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-3, hh - 12); ctx.lineTo(-3 + legSwing * 0.5, hh - 1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, hh - 12); ctx.lineTo(4 - legSwing * 0.5, hh - 1); ctx.stroke();

  ctx.fillStyle = '#FFB454'; roundRect(-hw - 1, -6, 7, 16, 3); ctx.fill();
  ctx.fillStyle = '#F4F7FF'; roundRect(-8, -4, 16, 16, 6); ctx.fill();

  ctx.strokeStyle = '#F4F7FF'; ctx.lineWidth = 4;
  const armSwing = p.onGround ? Math.sin(p.runCycle + Math.PI) * 3 : 2;
  ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(8, 4 + armSwing); ctx.stroke();

  ctx.drawImage(GLOW.white, -20, -hh - 4, 40, 40);
  ctx.fillStyle = '#F4F7FF'; ctx.beginPath(); ctx.arc(0, -hh + 8, 11, 0, TAU); ctx.fill();
  const vg = ctx.createLinearGradient(-8, -hh + 2, 8, -hh + 14);
  vg.addColorStop(0, '#61D9FF'); vg.addColorStop(1, '#1479FF');
  ctx.fillStyle = vg; ctx.beginPath(); ctx.ellipse(1, -hh + 8, 7.5, 6.5, 0, 0, TAU); ctx.fill();
  const glx = Math.sin(p.glint * 1.2) * 3;
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.ellipse(glx - 2, -hh + 5, 2, 3, -0.4, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---- particles ---- */
function drawParticles() {
  for (let i = 0; i < PCAP; i++) {
    const p = particles[i]; if (!p.live) continue;
    const a = clamp(p.life / p.max, 0, 1);
    if (p.kind === 3) {
      ctx.globalAlpha = a * 0.7; ctx.strokeStyle = p.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, (1 - a) * 18 + 4, 0, TAU); ctx.stroke();
    } else { ctx.globalAlpha = a; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  }
  ctx.globalAlpha = 1;
}

/* ---- hints ---- */
function drawHints(camX) {
  if (!G.player || G.mode !== 'play') return;   // teaching hints belong to the run, not the attract scene
  for (const h of G.hints) {
    const fade = clamp((h.x + 180 - G.player.x) / 180, 0, 1);
    if (fade <= 0) continue;
    ctx.globalAlpha = fade * 0.6; ctx.fillStyle = '#CFE3FF';
    ctx.font = '700 12px ' + FONT; ctx.textAlign = 'center';
    // Clamp into the visible frame so hint text never clips at a screen edge.
    const hw = ctx.measureText(h.text).width / 2;
    ctx.fillText(h.text, clamp(h.x, camX + hw + 10, camX + view.w - hw - 10), h.y);
  }
  ctx.globalAlpha = 1;
}

/* ---- popups ---- */
function drawPopups(camX, camY) {
  ctx.save(); ctx.translate(G.shake.x, G.shake.y); ctx.translate(-camX, -camY);
  for (const p of popups) {
    const t = 1 - p.life / p.max, sc = t < 0.3 ? easeOutBack(t / 0.3) * 1.2 : 1.2;
    ctx.globalAlpha = clamp(p.life / 20, 0, 1);
    ctx.font = '900 ' + (11 * sc) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.restore();
}

/* ---------------------------------------------------------------------------
   23. HUD
   ------------------------------------------------------------------------- */
const FONT = "'Orbitron', ui-rounded, -apple-system, 'Segoe UI', system-ui, sans-serif";
function drawHUD() {
  const us = clamp(view.w / 560, 0.72, 1);          // shrink HUD on narrow (portrait) views
  const top = 12 + safeInset('top'), left = 12 + safeInset('left');

  // pause button — enclosed rounded square so it reads as tappable, not as
  // part of the odometer; hidden once the player is dead (nothing to pause).
  const dead = G.player && G.player.dead;
  const ps = 30 * us;
  if (!dead) {
    ctx.fillStyle = 'rgba(10,14,32,0.72)';
    roundRect(left, top - 4 * us, ps, ps, 8 * us); ctx.fill();
    ctx.strokeStyle = 'rgba(56,225,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
    const bw = 3.5 * us, bh = 13 * us, bx = left + ps / 2 - bw - 2 * us, by = top - 4 * us + (ps - bh) / 2;
    ctx.fillStyle = '#CFE3FF';
    ctx.fillRect(bx, by, bw, bh); ctx.fillRect(bx + bw + 4 * us, by, bw, bh);
  }
  G._pauseHit = dead ? null : {
    x0: (left - 8) / view.w * window.innerWidth, x1: (left + ps + 10) / view.w * window.innerWidth,
    y0: (top - 12) / view.h * window.innerHeight, y1: (top + ps + 8) / view.h * window.innerHeight,
  };

  // odometer + score, indented past the pause button
  const ox = left + (dead ? 0 : ps + 14 * us);
  ctx.textAlign = 'left';
  drawGlowText(Math.floor(G.dist) + 'm', ox, top + 15 * us, 20 * us, '#38E1FF', '#F4F7FF');
  drawGlowText(String(Math.floor(G.dispScore)).padStart(5, '0'), ox, top + 34 * us, 13 * us, '#38E1FF', '#CFE3FF');

  if (G.chain > 0) {
    ctx.textAlign = 'center';
    drawGlowText('×' + (1 << G.chain) + ' CHAIN', view.w / 2, top + 16 * us, 18 * us, '#FFC93C', '#FFE59A');
  }

  const touch = FORCE_TOUCH || input.usingTouch;
  if (!touch) {
    const rx = view.w - left, pw2 = 6 * us, sp = 9 * us;
    for (let i = 0; i < CFG.ammoCap; i++) {
      ctx.fillStyle = i < G.ammo ? '#FFC93C' : 'rgba(255,255,255,0.15)';
      ctx.fillRect(rx - i * sp - pw2, top + 2, pw2 - 1, 11 * us);
    }
    ctx.fillStyle = '#CFE3FF'; ctx.font = '600 ' + (9 * us) + 'px ' + FONT; ctx.textAlign = 'right';
    ctx.fillText('AMMO', rx, top + 24 * us);
  }
}
function drawGlowText(text, x, y, size, glow, fill) {
  ctx.font = '900 ' + size + 'px ' + FONT;
  ctx.save(); ctx.transform(1, 0, -0.08, 1, 0, 0);
  ctx.fillStyle = glow; ctx.globalAlpha = 0.5; ctx.fillText(text, x + 1.5, y + 1.5);
  ctx.globalAlpha = 1; ctx.fillStyle = fill; ctx.fillText(text, x, y);
  ctx.restore();
}
function safeInset(side) { const v = getComputedStyle(document.documentElement).getPropertyValue('--sa-' + side); return parseFloat(v) || 0; }

/* ---- vignette / stingers ---- */
function drawVignette() {
  if (G.vignette > 0.05) {
    const a = G.vignette * 0.6;
    const grd = ctx.createRadialGradient(view.w / 2, view.h / 2, view.h * 0.3, view.w / 2, view.h / 2, view.h * 0.75);
    grd.addColorStop(0, 'rgba(255,79,102,0)'); grd.addColorStop(1, 'rgba(255,79,102,' + a + ')');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, view.w, view.h);
  }
  if (G.edgePulse > 0) { ctx.strokeStyle = 'rgba(255,201,60,' + G.edgePulse * 0.6 + ')'; ctx.lineWidth = 8; ctx.strokeRect(4, 4, view.w - 8, view.h - 8); }
  if (G.stinger > 0) {
    ctx.globalAlpha = clamp(G.stinger, 0, 1) * Math.min(1, (2.4 - G.stinger) * 3);
    ctx.textAlign = 'center';
    drawGlowText('DEEP SPACE', view.w / 2, view.h / 2, 28, '#38E1FF', '#F4F7FF');
    ctx.globalAlpha = 1;
  }
}
function drawCelebration() {
  if (G.celebrate <= 0) return;
  const t = G.celebrate;
  ctx.strokeStyle = 'rgba(255,201,60,' + clamp(t, 0, 1) * 0.9 + ')'; ctx.lineWidth = 10;
  ctx.strokeRect(5, 5, view.w - 10, view.h - 10);
  ctx.textAlign = 'center'; ctx.globalAlpha = clamp(t * 2, 0, 1);
  drawGlowText(G.celebrateText || 'NEW BEST!', view.w / 2, view.h * 0.3, 30, '#FFC93C', '#FFE59A');
  ctx.globalAlpha = 1;
}

/* ---- touch controls ---- */
function drawTouchControls() {
  layoutTouch();
  // Draw in CSS-pixel space (layoutTouch works in CSS px): converting through
  // logical units mixed coordinate systems and pushed the pip ring off-screen.
  ctx.save();
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  const sx = input.shootBtn.cx, sy = input.shootBtn.cy, r = input.shootBtn.r;
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU);
  ctx.fillStyle = input.shootBtn.pressed ? 'rgba(255,201,60,0.35)' : 'rgba(255,201,60,0.16)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,201,60,0.7)'; ctx.lineWidth = 2; ctx.stroke();
  for (let i = 0; i < CFG.ammoCap; i++) {
    const a = -Math.PI / 2 + (i / CFG.ammoCap) * TAU;
    ctx.fillStyle = i < G.ammo ? '#FFC93C' : 'rgba(255,255,255,0.35)';
    const pr = r + 8 + G.ammoPulse * 4;
    ctx.beginPath(); ctx.arc(sx + Math.cos(a) * pr, sy + Math.sin(a) * pr, 2.6, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = G.ammo > 0 ? 'rgba(255,201,60,0.9)' : 'rgba(255,255,255,0.3)';
  ctx.font = '900 13px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('FIRE', sx, sy + 5);
  if (input.stick.active || FORCE_TOUCH) {
    const cssW = window.innerWidth, cssH = window.innerHeight;
    const gx = input.stick.active ? input.stick.cx : cssW * (settings.lefty ? 0.8 : 0.2);
    const gy = input.stick.active ? input.stick.cy : cssH * 0.72;
    ctx.globalAlpha = 0.3; ctx.strokeStyle = '#9FF1FF'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(gx, gy, 34, 0, TAU); ctx.stroke();
    if (input.stick.active) {
      ctx.fillStyle = '#9FF1FF'; ctx.beginPath(); ctx.arc(clamp(input.stick.x, gx - 34, gx + 34), gy, 12, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------------
   24. OVERLAYS / SCREENS
   ------------------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
function hideAllOverlays() { ['ovAttract', 'ovPause', 'ovDead', 'ovSettings', 'ovTrophy', 'ovInitials'].forEach((id) => $(id).classList.remove('show')); }
function showOverlay(id) { $(id).classList.add('show'); }

function medalGlyphs() {
  const order = ['PLATINUM', 'GOLD', 'SILVER', 'BRONZE'];
  const sym = { PLATINUM: '◆', GOLD: '●', SILVER: '●', BRONZE: '●' };
  const col = { PLATINUM: '#8FB7FF', GOLD: '#FFC93C', SILVER: '#CBD6E6', BRONZE: '#D98A48' };
  let s = '';
  order.forEach((m) => { const n = stats.medals[m] || 0; if (n > 0) s += `<span style="color:${col[m]}">${sym[m]}${n}</span> `; });
  return s || '<span style="opacity:0.4">no medals yet</span>';
}

function showAttract() {
  hideAllOverlays();
  $('btnPlay').textContent = matchMedia('(pointer: coarse)').matches ? 'Tap to Start' : 'Press Space';
  $('attractBest').textContent = 'BEST ' + bestScore.toLocaleString();
  $('attractMedals').innerHTML = medalGlyphs();
  $('attractStats').innerHTML = `RUNS ${stats.runs} · KILLS ${stats.kills} · BEST DIST ${stats.bestDist}m · BEST CHAIN ×${stats.bestChain}`;
  showOverlay('ovAttract');
  resetRun(SHOT_SEED !== null ? SHOT_SEED : 12345);
  G.mode = 'attract';
}

function togglePause() {
  if (G.mode === 'play') {
    if (G.player && G.player.dead) return;     // death sequence owns the screen
    clearInput();
    G.mode = 'pause'; syncSwitches(); showOverlay('ovPause');
  } else if (G.mode === 'pause') {
    hideAllOverlays(); Audio.resume(); clearInput();
    // Touch players need thumb-repositioning time; desktop resumes instantly.
    if (input.usingTouch) { G.mode = 'resume'; G.resumeT = 1.3; }
    else G.mode = 'play';
  }
}

function showDeathCard() {
  G.deathCardShown = true;
  finalizeDeath();
  G.mode = 'dead'; G.deadShownAt = G.time;
  if (settings.sound && G.runMedal) setTimeout(() => Audio.sfx.medal(G.runMedal.name === 'BRONZE' ? 1 : G.runMedal.name === 'SILVER' ? 2 : 3), 300);
  if (G.showPicker) { showInitials(); return; }   // only a full-table crack blocks; else auto-committed
  renderDeathCard();
}
function renderDeathCard() {
  const fs = G.finalScore !== undefined ? G.finalScore : Math.floor(G.score);
  $('deadScore').textContent = fs.toLocaleString();
  $('deadMedal').innerHTML = G.runMedal ? `<span style="color:${G.runMedal.c}">${G.runMedal.name} MEDAL</span>` : '';
  // Delta strictly vs the pre-run best (bestScore is already updated by now) —
  // a first-ever run is a NEW BEST, and the gold line never shows a stale +0.
  if (fs > G.prevBest) $('deadDelta').innerHTML = `<span style="color:#FFC93C">NEW BEST +${(fs - G.prevBest).toLocaleString()}</span>`;
  else $('deadDelta').textContent = (G.prevBest - fs).toLocaleString() + ' TO BEAT';
  $('deadStats').innerHTML = `DIST ${G.dist}m · KILLS ${G.killsRun} · BEST CHAIN ×${G.bestChainRun}`;
  renderScoreTable('deadScores', true);
  const chip = $('installChip');
  if (deferredPrompt && !flags.installDismissed && stats.runs >= 3) chip.classList.add('show'); else chip.classList.remove('show');
  hideAllOverlays(); showOverlay('ovDead');
}
function renderScoreTable(id, highlight) {
  let html = '';
  for (let i = 0; i < 5; i++) {
    const e = top5[i], me = highlight && e && e === justAdded;
    html += `<tr class="${me ? 'me' : ''}"><td class="rank">${i + 1}</td><td>${e ? e.initials : '---'}</td><td class="sc">${e ? e.score.toLocaleString() : '—'}</td></tr>`;
  }
  $(id).innerHTML = html;
}

/* ---- initials picker ---- */
let initialsChars = ['A', 'A', 'A'];
let justAdded = null;   // runtime ref to this run's top-5 entry (never persisted as a flag)
function nextChar(c, d) { let code = c.charCodeAt(0) - 65 + d; code = (code + 26) % 26; return String.fromCharCode(65 + code); }
function showInitials() {
  initialsChars = flags.initials.split('');
  const pick = $('initialsPicker'); pick.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const col = document.createElement('div'); col.className = 'initial-col';
    const up = document.createElement('button'); up.className = 'arrow-btn'; up.textContent = '▲';
    const ch = document.createElement('div'); ch.className = 'initial-char'; ch.textContent = initialsChars[i];
    const dn = document.createElement('button'); dn.className = 'arrow-btn'; dn.textContent = '▼';
    up.onclick = () => { initialsChars[i] = nextChar(initialsChars[i], 1); ch.textContent = initialsChars[i]; Audio.sfx.ui(3); };
    dn.onclick = () => { initialsChars[i] = nextChar(initialsChars[i], -1); ch.textContent = initialsChars[i]; Audio.sfx.ui(1); };
    col.appendChild(up); col.appendChild(ch); col.appendChild(dn); pick.appendChild(col);
  }
  hideAllOverlays(); showOverlay('ovInitials');
}
function commitInitials() {
  // The entry was auto-committed in finalizeDeath; the picker only renames it.
  flags.initials = initialsChars.join('');
  if (justAdded) justAdded.initials = flags.initials;
  persistAll();
  renderDeathCard();
}

/* ---- trophy ---- */
function showTrophy() {
  renderScoreTable('trophyScores', false);
  $('trophyStats').innerHTML = `RUNS ${stats.runs} · KILLS ${stats.kills} · BEST DIST ${stats.bestDist}m`;
  showOverlay('ovTrophy');
}

/* ---- settings ---- */
function syncSwitches() {
  [['swSound', 'sound'], ['swShake', 'shake'], ['swLeft', 'lefty'], ['swSound2', 'sound'], ['swShake2', 'shake'], ['swLeft2', 'lefty']]
    .forEach(([id, key]) => { const el = $(id); if (el) el.classList.toggle('on', !!settings[key]); });
}
function toggleSetting(key) {
  settings[key] = !settings[key];
  if (key === 'sound') Audio.setMute(!settings.sound);
  syncSwitches(); persistAll();
}

/* ---------------------------------------------------------------------------
   25. UI WIRING
   ------------------------------------------------------------------------- */
$('btnPlay').onclick = () => { Audio.ensure(); Audio.resume(); startRun(); };
$('btnTrophy').onclick = () => { Audio.ensure(); hideAllOverlays(); showTrophy(); };
$('btnSettings').onclick = () => { syncSwitches(); hideAllOverlays(); showOverlay('ovSettings'); };
$('btnCloseSettings').onclick = () => showAttract();
$('btnCloseTrophy').onclick = () => showAttract();
$('btnResume').onclick = () => togglePause();
$('btnQuit').onclick = () => {
  // Quitting mid-death-sequence must still bank the run (stats, medal, best).
  if (G.player && G.player.dead && !G.deathCardShown) { G.deathCardShown = true; finalizeDeath(); }
  showAttract();
};
$('btnAgain').onclick = () => tryRestart();
$('btnInitialsOk').onclick = () => commitInitials();
$('swSound').onclick = () => toggleSetting('sound');
$('swShake').onclick = () => toggleSetting('shake');
$('swLeft').onclick = () => toggleSetting('lefty');
$('swSound2').onclick = () => toggleSetting('sound');
$('swShake2').onclick = () => toggleSetting('shake');
$('swLeft2').onclick = () => toggleSetting('lefty');
$('btnReset').onclick = () => {
  if (!confirm('Erase all scores, stats, and settings?')) return;
  try { [LS.best, LS.stats, LS.settings, LS.top5, LS.flags, 'highScores'].forEach((k) => localStorage.removeItem(k)); } catch (e) {}
  location.reload();
};
$('installChip').onclick = () => {
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
  flags.installDismissed = true; persistAll(); $('installChip').classList.remove('show');
};
$('ovDead').addEventListener('pointerdown', (e) => {
  if (e.target.closest('.btn') || e.target.closest('.install-chip')) return;
  tryRestart();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.mode === 'play' || G.mode === 'resume') { G.mode = 'play'; togglePause(); } }
  else Audio.resume();
});

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

/* ---------------------------------------------------------------------------
   26. SAFE-AREA INSET CSS VARS
   ------------------------------------------------------------------------- */
(function injectSafeVars() {
  const s = document.createElement('style');
  s.textContent = ':root{--sa-top:env(safe-area-inset-top);--sa-left:env(safe-area-inset-left);--sa-right:env(safe-area-inset-right);--sa-bottom:env(safe-area-inset-bottom);}';
  document.head.appendChild(s);
})();

/* ---------------------------------------------------------------------------
   27. SERVICE WORKER
   ------------------------------------------------------------------------- */
if ('serviceWorker' in navigator && !SHOT) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(() => {}); });
}

/* ---------------------------------------------------------------------------
   28. QA SHOT MODE — deterministic, synchronous, scripted bot
   ------------------------------------------------------------------------- */
function botInput() {
  const p = G.player;
  input.usingTouch = false; input.left = false; input.right = true; input.stickX = 0; input.shoot = false;
  const cur = p.groundPlat;
  let next = null;
  for (const pl of G.platforms) if (cur && pl.x > cur.x + 1 && (!next || pl.x < next.x)) next = pl;
  const lip = cur ? (cur.x + cur.w) - (p.x + p.w) : 999;            // px from player front to current lip
  const gapAhead = (cur && next) ? next.x - (cur.x + cur.w) : 0;
  const nextHigher = (cur && next) ? (cur.y - next.y) : 0;          // >0 means next platform is higher
  let enemyAhead = false;
  for (const e of G.enemies) if (!e.dead && e.x > p.x + 6 && e.x < p.x + 95 && Math.abs(e.y - (p.y + p.h)) < 46) enemyAhead = true;

  if (p.onGround) {
    // launch at the very lip on flats (max reach); a bit earlier when climbing to a higher platform
    const trigger = nextHigher > 20 ? 58 : 20;
    if ((lip < trigger && (gapAhead > 30 || nextHigher > 20)) || enemyAhead) { if (!input.jumpHeld) input.jumpPressed = true; input.jumpHeld = true; }
    else input.jumpHeld = false;
  } else {
    input.jumpHeld = p.vy < 0;                                      // hold through the rise for the full arc
  }

  for (const e of G.enemies) if (!e.dead && e.type === 'shoot' && Math.abs(e.y - (p.y + p.h / 2)) < 46 && e.x > p.x && e.x < p.x + 240 && G.ammo > 0) input.shoot = true;
}

function runShot() {
  const seed = SHOT_SEED !== null ? SHOT_SEED : 42;
  resetRun(seed);
  G.mode = 'play'; hideAllOverlays();
  const el = $('errlog'); el.classList.add('show'); el.textContent = window.__errors.join('\n');
  if (FORCE_TOUCH) input.usingTouch = true;
  for (let i = 0; i < SHOT_FRAMES; i++) {
    if (G.player.dead) break;
    botInput();
    G.freeze = 0; G.timescale = 1; G.slowTimer = 0;   // no time dilation in headless
    update();
  }
  if (SHOT === 'dead') {
    if (!G.player.dead) die('void');
    G.deathSeq = 1.0; G.deathZoom = 1.3;
    G.deathCardShown = true; finalizeDeath();
    G.mode = 'dead'; G.qualifies = false;
    renderDeathCard();
  } else if (SHOT === 'pause') {
    G.mode = 'pause'; syncSwitches(); showOverlay('ovPause');
  }
  el.textContent = window.__errors.join('\n');
  render(1);
  // keep re-rendering the frozen deterministic frame so a post-load resize can't leave a blank canvas
  shotFrozen = true; lastT = 0; rafId = requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------------------
   29. FONT READINESS then BOOT
   ------------------------------------------------------------------------- */
function boot() {
  resize();
  booted = true;
  syncSwitches();
  Audio.setMute(!settings.sound);
  if (SHOT) { runShot(); return; }
  showAttract();
  lastT = 0; rafId = requestAnimationFrame(frame);
}
try {
  if (document.fonts && document.fonts.load) document.fonts.load('900 20px Orbitron').catch(() => {});
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {}).catch(() => {});
} catch (e) {}

boot();
</script>
</body>
</html>
