name: Shared cosmetics browsers
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  cosmetics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify wardrobe controls, migrations and mode consistency
        run: node --test cosmetics.test.cjs runner-pause.test.cjs
        env:
          SPACE_MAN_COSMETICS_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_PAUSE_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_PAUSE_SCREENSHOTS: ${{ runner.temp }}/cosmetics-screenshots
          SPACE_MAN_COSMETICS_SCREENSHOTS: ${{ runner.temp }}/cosmetics-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmetics-${{ matrix.engine }}-screenshots
          path: ${{ runner.temp }}/cosmetics-screenshots/*.png
