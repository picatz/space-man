name: Perspective racing browsers
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  perspective:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify perspective cameras and fallback pixels
        run: node --test race-perspective.test.cjs
        env:
          SPACE_MAN_RACE_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_RACE_SCREENSHOTS: ${{ runner.temp }}/perspective-screenshots
      - name: Verify complete race and mobile lifecycle
        run: node --test race.test.cjs
        env:
          SPACE_MAN_RACE_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_RACE_SCREENSHOTS: ${{ runner.temp }}/perspective-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perspective-${{ matrix.engine }}-screenshots
          path: ${{ runner.temp }}/perspective-screenshots/*.png
          retention-days: 3

  deployed-preview:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'perspective-preview-check' &&
      github.event.pull_request.user.login == 'picatz' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Resolve and verify the exact published commit URL
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const response = await fetch('https://spacemangame.online/pr/previews.json', {cache:'no-store'});
            if (!response.ok) throw Error('Preview manifest is unavailable');
            const manifest = await response.json();
            const item = manifest.previews.find(p => p.number === Number(process.env.PR_NUMBER) && p.sha === process.env.HEAD_SHA);
            if (!item) throw Error('This exact head is not published yet; run after Pages finishes');
            const url = new URL(item.url);
            if (!/^[a-f0-9]{40}$/.test(item.buildSha) || url.origin !== 'https://spacemangame.online' || url.username || url.password || url.search || url.hash || url.pathname !== `/pr/${process.env.PR_NUMBER}/${process.env.HEAD_SHA}/${item.buildSha}/`) throw Error('Unexpected preview identity');
            fs.appendFileSync(process.env.GITHUB_ENV, `SPACE_MAN_BASE_URL=${url.href}\n`);
            console.log('Verified deployed preview', url.href);
          })().catch(error => { console.error(error); process.exitCode=1; });
          NODE
      - name: Drive the published build through cameras, bends, full race and runner return
        run: node --test race-perspective.test.cjs
        env:
          SPACE_MAN_RACE_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_RACE_SCREENSHOTS: ${{ runner.temp }}/deployed-screenshots
      - name: Verify deployed road contacts and native race audio
        run: node --test race-handling-audio.test.cjs
        env:
          SPACE_MAN_RACE_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_RACE_SCREENSHOTS: ${{ runner.temp }}/deployed-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perspective-deployed-${{ matrix.engine }}-screenshots
          path: ${{ runner.temp }}/deployed-screenshots/*.png
          retention-days: 3
