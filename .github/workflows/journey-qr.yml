name: Journey invite QR browsers
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  invite-qr:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - name: Install independent QR pixel decoder
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Decode actual QR pixels and join the same encrypted room
        run: node --test journey-qr-pixels.test.cjs journey-qr.test.cjs
        env:
          SPACE_MAN_JOURNEY_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_JOURNEY_SCREENSHOTS: ${{ runner.temp }}/journey-qr-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-qr-${{ matrix.engine }}
          path: ${{ runner.temp }}/journey-qr-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3
