name: Home browsers
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify home layouts, real entry flows, saved identity and focus
        run: node --test home.test.cjs home-shell.test.cjs
        env:
          SPACE_MAN_HOME_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_HOME_SCREENSHOTS: ${{ runner.temp }}/home-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-${{ matrix.engine }}-screenshots
          path: ${{ runner.temp }}/home-screenshots/*.png
          retention-days: 3
