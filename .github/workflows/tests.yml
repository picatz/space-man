name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs

  preview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check preview paths, caches, and saves without a relay
        run: npm run test:previews
      - name: Check arena controls, match flow, and runner return without a relay
        run: npm run test:arena
        env:
          SPACE_MAN_ARENA_SCREENSHOTS: ${{ runner.temp }}/arena-screenshots
      - name: Keep arena browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-browser-screenshots
          path: ${{ runner.temp }}/arena-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3
