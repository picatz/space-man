name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs

  preview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - name: Select available Chromium browser
        timeout-minutes: 4
        run: |
          # Hosted runners often already contain Chrome. Avoid an unnecessary
          # browser/apt download on that path; use pinned Playwright otherwise.
          if command -v google-chrome >/dev/null 2>&1; then
            echo "SPACE_MAN_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            echo "SPACE_MAN_CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
            chromium --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Check preview paths, caches, and saves without a relay
        run: npm run test:previews
        env:
          SPACE_MAN_PREVIEW_SCREENSHOTS: ${{ runner.temp }}/preview-screenshots
      - name: Keep preview mobile layout screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-mobile-screenshots
          path: ${{ runner.temp }}/preview-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Check arena controls, match flow, and runner return without a relay
        run: npm run test:arena
        env:
          SPACE_MAN_ARENA_SCREENSHOTS: ${{ runner.temp }}/arena-screenshots
      - name: Keep arena browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-browser-screenshots
          path: ${{ runner.temp }}/arena-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3

  arena-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - name: Install the pinned WebKit engine and dependencies
        run: npx playwright install --with-deps webkit
      - name: Check constrained mobile setup in WebKit
        run: node --test --test-name-pattern='arena mobile' arena.test.cjs
        env:
          SPACE_MAN_ARENA_BROWSER: webkit
          SPACE_MAN_ARENA_SCREENSHOTS: ${{ runner.temp }}/arena-webkit-screenshots
      - name: Keep WebKit mobile screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-webkit-screenshots
          path: ${{ runner.temp }}/arena-webkit-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3
