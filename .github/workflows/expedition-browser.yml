name: Expedition browsers
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  expedition:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Play the complete solo expedition and check constrained layouts
        run: node --test expedition.test.cjs
        env:
          SPACE_MAN_EXPEDITION_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_EXPEDITION_SCREENSHOTS: ${{ runner.temp }}/expedition-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expedition-${{ matrix.engine }}-screenshots
          path: ${{ runner.temp }}/expedition-screenshots/*.png
          retention-days: 3

  deployed-preview:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'expedition-preview-check' &&
      github.event.pull_request.user.login == 'picatz' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Resolve the exact published preview
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const response = await fetch('https://spacemangame.online/pr/previews.json', {cache:'no-store'});
            if (!response.ok) throw Error('Preview manifest unavailable');
            const data = await response.json();
            const item = data.previews.find(p => p.number === Number(process.env.PR_NUMBER) && p.sha === process.env.HEAD_SHA);
            if (!item) throw Error('Exact head not published yet');
            const url = new URL(item.url);
            if (!/^[a-f0-9]{40}$/.test(item.buildSha) || url.origin !== 'https://spacemangame.online' || url.username || url.password || url.search || url.hash || url.pathname !== `/pr/${process.env.PR_NUMBER}/${process.env.HEAD_SHA}/${item.buildSha}/`) throw Error('Unexpected preview identity');
            fs.appendFileSync(process.env.GITHUB_ENV, `SPACE_MAN_BASE_URL=${url.href}\nSPACE_MAN_EXPECTED_SHA=${process.env.HEAD_SHA}\n`);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Play the deployed expedition through all three modes
        run: node --test expedition.test.cjs
        env:
          SPACE_MAN_EXPEDITION_BROWSER: ${{ matrix.engine }}
          SPACE_MAN_EXPEDITION_SCREENSHOTS: ${{ runner.temp }}/expedition-deployed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expedition-deployed-${{ matrix.engine }}
          path: ${{ runner.temp }}/expedition-deployed/*.png
          retention-days: 3
